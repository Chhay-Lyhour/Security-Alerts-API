# Security Alerts API as a service, plus a demo app that uses it and a
# Grafana dashboard on http://localhost:3030.
#
#   cp .env.example .env        # then set JWT_SECRET
#   docker compose up -d --build
#
# Values come from .env. Host ports can be changed there too, e.g.
# REDIS_HOST_PORT=6380 if Redis already runs on your machine.

name: security-alerts

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-security_alerts}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file, so queued notification jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # The security layer other apps plug into.
  api:
    build: .
    image: security-alerts-api:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network, services are reached by name.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-security_alerts}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Bring the schema up to date on start (no separate migrate step).
      DATABASE_RUN_MIGRATIONS: 'true'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${API_HOST_PORT:-3000}:3000'

  # A fictional bank's website, the "integrated app". It asks the API whether
  # a visitor's IP is blocked and reports failed logins as alerts.
  bank-demo:
    build: ./demo/bank-app
    image: security-alerts-bank-demo:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      SECURITY_API_URL: http://api:3000
      # Created by `npm run demo:setup` (or by hand with POST /sources).
      SECURITY_API_KEY: ${BANK_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${BANK_HOST_PORT:-4000}:4000'

  # Creates the read-only Postgres login Grafana uses, once the API's
  # migrations have created the tables. Runs on every `up` and exits.
  grafana-init:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USER:-postgres}
      PGPASSWORD: ${DATABASE_PASSWORD:-postgres}
      PGDATABASE: ${DATABASE_NAME:-security_alerts}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader-password}
    volumes:
      - ./docker/grafana/grant-reader.sql:/grant-reader.sql:ro
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -v pw="$$GRAFANA_DB_PASSWORD" -v db="$$PGDATABASE" -f /grant-reader.sql
    depends_on:
      api:
        condition: service_healthy

  # Live dashboard on http://localhost:3030 (see docs/GRAFANA.md).
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/security-alerts.json
      # Read by docker/grafana/provisioning/datasources/postgres.yml
      SA_DB_HOST: postgres:5432
      SA_DB_NAME: ${DATABASE_NAME:-security_alerts}
      SA_DB_USER: grafana_reader
      SA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-reader-password}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    ports:
      - '${GRAFANA_HOST_PORT:-3030}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  grafanadata:
